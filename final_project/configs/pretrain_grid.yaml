# MAE Pretraining Configuration - Grid Masking
# This config uses structured grid-based masking patterns

# Model architecture (ViT-Tiny)
model:
  type: mae_vit_tiny
  img_size: 64
  patch_size: 16
  in_chans: 3
  embed_dim: 192
  depth: 12
  num_heads: 3
  decoder_embed_dim: 512
  decoder_depth: 4
  decoder_num_heads: 8
  mlp_ratio: 4.0
  norm_pix_loss: true

# Masking strategy
masking:
  type: grid
  mask_ratio: 0.75
  pattern: checkerboard  # Options: checkerboard, stripes_h, stripes_v, blocks

# Dataset
data:
  dataset: tinyimagenet
  data_path: ./data/tiny-imagenet-200
  batch_size: 128
  num_workers: 4
  pin_memory: true

# Data augmentation
augmentation:
  random_resized_crop:
    size: 64
    scale: [0.67, 1.0]
    ratio: [0.75, 1.33]
  horizontal_flip: true
  color_jitter: null
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

# Training
training:
  epochs: 100
  warmup_epochs: 10
  optimizer: adamw
  lr: 1.5e-4
  weight_decay: 0.05
  betas: [0.9, 0.95]
  lr_schedule: cosine
  min_lr: 0.0
  use_amp: true
  clip_grad: null
  log_interval: 50
  save_interval: 10

# System
system:
  seed: 42
  device: cuda
  output_dir: ./checkpoints
  log_dir: ./logs
  resume: null

# Experiment tracking
wandb:
  enabled: false
  project: mae-structured-masking
  entity: null
  name: grid-checkerboard-mask-0.75
